name: יצירת קריינים (הילה ואברי – בלי מפתח)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the voice tool
        run: pip install edge-tts
      - name: Generate narrator audio
        run: python tools/generate-voices-edge.py
      - name: Save the audio files to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find audio -name '*.tmp' -delete
          git add audio
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "קריינים: הילה ואברי"
          git pull --rebase
          git push
      - name: Refresh the game site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
