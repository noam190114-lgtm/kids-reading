name: השוואת קריינים

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get install -y ffmpeg >/dev/null || true
          pip install edge-tts soundfile
          pip install phonikud phonikud-onnx piper-onnx || echo "phonikud install failed"
      - name: Build the comparison page
        run: python tools/voice-compare.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compare compare.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "השוואת קריינים"
          git pull --rebase
          git push
      - name: Refresh the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
