name: יצירת קריינים (ElevenLabs)

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "שמות הקולות מ-ElevenLabs, מופרדים בפסיק (ריק = 4 הקולות הראשונים בחשבון)"
        required: false
        default: ""
      redo:
        description: "קולות ליצור מחדש מאפס (לא חובה)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate narrator audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICES: ${{ inputs.voices }}
          REDO: ${{ inputs.redo }}
        run: node tools/generate-voices.mjs
      - name: Save the audio files to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "קריינים: עדכון קבצי שמע"
          git push
      - name: Refresh the game site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
