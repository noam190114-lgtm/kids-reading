name: יצירת קריינים (Azure – הילה ואברי)

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "קולות: שם=מזהה:מין, מופרדים בפסיק"
        required: false
        default: "הילה=he-IL-HilaNeural:female,אברי=he-IL-AvriNeural:male"
      redo:
        description: "קולות ליצור מחדש מאפס (לא חובה)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate narrator audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          VOICES: ${{ inputs.voices }}
          REDO: ${{ inputs.redo }}
        run: node tools/generate-voices-azure.mjs
      - name: Save the audio files to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "קריינים: הילה ואברי (Azure)"
          git pull --rebase
          git push
      - name: Refresh the game site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
