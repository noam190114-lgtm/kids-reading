<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קוראים עם החברים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ff8a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קוראים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff6e5; --bg2:#e6f4ff; --ink:#2b2d42; --muted:#6b7086;
  --ok:#2bb673; --bad:#ef5b5b; --card:#ffffff; --shadow:0 6px 0 rgba(43,45,66,.12);
  --accent:#ff8a5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Rubik","Noto Sans Hebrew",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg2),var(--bg1) 70%);min-height:100vh;
}
.heb{font-family:"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:clamp(22px,4.5vw,34px);margin:0;flex:1;font-weight:800}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:700;font-size:18px}
.iconbtn{background:var(--card);width:52px;height:52px;border-radius:16px;box-shadow:var(--shadow);font-size:26px;display:grid;place-items:center}
.iconbtn:active,.btn:active,.opt:active,.tile:active,.stage:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,45,66,.12)}

/* map */
.sub{color:var(--muted);margin:0 0 18px;font-size:18px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.stage{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);text-align:right;display:flex;gap:14px;align-items:center;position:relative;border:4px solid transparent}
.stage .ani{font-size:56px;line-height:1;width:76px;height:76px;border-radius:20px;display:grid;place-items:center}
.stage .num{font-size:15px;color:var(--muted);font-weight:700}
.stage .ttl{font-size:26px;font-weight:800;margin:2px 0}
.stage .stars{font-size:20px;letter-spacing:2px}
.stage.locked{opacity:.55;filter:grayscale(.7)}
.stage.locked::after{content:"🔒";position:absolute;left:14px;top:12px;font-size:24px}
.stage.next{border-color:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.parent{margin-top:28px;background:rgba(255,255,255,.7);border-radius:18px;padding:14px 18px;color:var(--muted);font-size:15px;line-height:1.6}
.parent summary{cursor:pointer;font-weight:700;color:var(--ink)}
.voicebox{background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--ink)}
.voicebox>div{flex-basis:100%;color:var(--muted)}
.voicebox select{font:inherit;font-size:15px;padding:4px 6px;border-radius:8px;border:1px solid #ccd;max-width:220px}
.btn.small{font-size:16px;padding:6px 14px;border-radius:12px}
.stabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stab{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center}
.stab small{color:var(--muted);font-weight:500}
.stab.on{outline:3px solid var(--accent)}
.rtext{font-size:22px;line-height:1.6;margin:8px 0}
.recrow{display:flex;gap:14px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.recbtn{background:var(--bad);color:#fff;font-weight:800;font-size:26px;border-radius:999px;padding:16px 34px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.recbtn.on{background:#2b2d42;animation:pulse 1s infinite}
.nav{background:#fff;border-radius:50%;width:58px;height:58px;font-size:28px;box-shadow:var(--shadow)}
.nav:disabled{opacity:.3}
.okmark{color:var(--ok);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:#fff;border-radius:12px;padding:6px 12px;font-size:20px;border:2px solid #eef0f6}
.chip.has{border-color:var(--ok);background:#e7f8ef}
.chip.on{outline:3px solid var(--accent)}
.vbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.vchip{background:#f3f4fa;border-radius:999px;padding:6px 14px;font-weight:700;border:2px solid transparent}
.vchip small{color:var(--muted)}
.vchip.on{border-color:var(--accent);background:#fff1ea}
.addv{display:inline-flex;gap:6px;align-items:center}
.addv input{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:1px solid #ccd;width:170px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.actcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:14px 10px 12px;position:relative;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.actcard.hard{border-color:#ffd0b5;background:linear-gradient(#fff,#fff6ef)}
.actcard .aicon{font-size:44px}
.actcard .aname{font-size:19px;font-weight:800;text-align:center;line-height:1.3}
.actcard .astars{font-size:16px;color:var(--muted)}
.actcard .anum{position:absolute;right:10px;top:8px;font-size:13px;color:var(--muted);font-weight:700}
.actcard .fire{position:absolute;left:10px;top:6px;font-size:18px}
.meter{height:8px;background:#eef0f6;border-radius:9px;overflow:hidden;margin:6px 0 2px;width:140px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:9px}
.mixcard{border-color:#ffd166}
.opts.four{grid-template-columns:repeat(2,1fr)}
.opt.word{font-size:clamp(34px,8vw,52px)}
.opts.snd{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.hl{background:#ffe08a;border-radius:14px;padding:0 6px}
.gone{font-size:70px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1/1;background:linear-gradient(135deg,#ffb38a,#ff8a5b);border-radius:18px;box-shadow:var(--shadow);font-size:34px;color:#fff;display:grid;place-items:center}
.mcard.up{background:#fff;color:var(--ink);border:3px solid #eef0f6}
.mcard.done{border-color:var(--ok);background:#e7f8ef}
.mcard .me{font-size:clamp(36px,8vw,54px)}
.mcard .mw{font-size:clamp(20px,4.6vw,30px);font-weight:800;line-height:1.2}
.story .sline{display:block;width:100%;text-align:right;font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.6;padding:6px 12px;border-radius:14px;margin:4px 0}
.story .sline.on{background:#fff3c4}
.peek{margin-bottom:8px;color:var(--muted)}
.peek div{font-size:22px;line-height:1.6}
.q.big{font-size:clamp(26px,5vw,34px)}
.linkbtn{text-decoration:underline;color:var(--ink);font-weight:700}

/* lesson */
.guide{display:flex;gap:14px;align-items:flex-start;margin:6px 0 18px}
.guide .ani{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.bubble{background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);font-size:21px;line-height:1.5;position:relative;flex:1}
.bubble::before{content:"";position:absolute;right:-12px;top:22px;border:12px solid transparent;border-left-color:var(--card);border-right:0}
.bubble .say{float:left;margin-right:8px}
.panel{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.vowels{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.vowel{border-radius:20px;padding:10px 18px;text-align:center;min-width:150px}
.vowel .mark{font-size:84px;line-height:1.15;font-weight:800}
.vowel .vn{font-size:22px;font-weight:800}
.vowel .vh{font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:18px;box-shadow:var(--shadow);font-size:clamp(34px,7vw,50px);font-weight:800;padding:8px 0;border:3px solid #eef0f6;line-height:1.35}
.tile.flash{background:#fff3c4}
.wordrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wordcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px 16px;border:3px solid #eef0f6;text-align:center}
.wordcard .e{font-size:40px}
.wordcard .w{font-size:36px;font-weight:800}
.shva{color:#e0457b}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;font-weight:800;font-size:24px;border-radius:20px;padding:14px 28px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.center{text-align:center}
.steps{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.steps span{width:46px;height:10px;border-radius:9px;background:#d9dceb}
.steps span.on{background:var(--accent)}
.steps span.done{background:var(--ok)}

/* games */
.q{font-size:24px;font-weight:700;text-align:center;margin:4px 0 14px}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.prog i{width:14px;height:14px;border-radius:50%;background:#d9dceb;display:block}
.prog i.d{background:var(--ok)}
.prog i.c{background:var(--accent)}
.target{font-size:clamp(70px,16vw,120px);font-weight:800;text-align:center;line-height:1.25;margin:4px 0 10px}
.emoji{font-size:clamp(80px,18vw,120px);text-align:center;line-height:1.1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.opt{background:#fff;border-radius:22px;box-shadow:var(--shadow);border:4px solid #eef0f6;font-size:clamp(46px,10vw,70px);font-weight:800;padding:12px 0;line-height:1.3}
.opt.e{font-size:clamp(56px,12vw,84px)}
.opt.ok,.tile.ok{border-color:var(--ok);background:#e7f8ef}
.opt.bad,.tile.bad{border-color:var(--bad);background:#fdeaea;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;gap:10px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
.slot{min-width:92px;height:96px;border-radius:18px;border:4px dashed #c9cde0;display:grid;place-items:center;font-size:clamp(40px,9vw,58px);font-weight:800;background:rgba(255,255,255,.6)}
.slot.f{border-style:solid;border-color:var(--ok);background:#e7f8ef}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tiles .tile{min-width:96px;padding:8px 14px}
.tile.used{visibility:hidden}
.feedback{min-height:40px;text-align:center;font-size:26px;font-weight:800;margin-top:14px}
.feedback.good{color:var(--ok)}
.feedback.try{color:var(--bad)}
.speak{background:#fff;border-radius:50%;width:64px;height:64px;font-size:30px;box-shadow:var(--shadow);display:inline-grid;place-items:center}
.speak.big{width:96px;height:96px;font-size:46px}
.done-ani{font-size:110px;animation:bob 1.6s infinite}
.bigstars{font-size:64px;letter-spacing:6px}
.confetti{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.note{font-size:15px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- data ---------- */
const LETTERS=['מ','ל','ס','נ','ר','ד','בּ','ת','שׁ','פּ','ג','ז'];
const SAY={a:L=>L+'ָה',i:L=>L+'ִי',o:L=>L+'וֹ',e:L=>L+'ֶה',u:L=>L+'וּ'};
// word | picture | syllables (split by -)
const W=s=>{const [w,e,syl]=s.split('|');return [w,e,syl.split('-')]};
const STAGES=[
 {animal:'🐰',guide:'ארנבי',title:'קָמַץ וּפַתַח',sound:'a',color:'#ffd9c7',
  intro:'שָׁלוֹם! אֲנִי אַרְנָבִי. הַקָּמַץ וְהַפַּתַח הֵם חֲבֵרִים טוֹבִים – שְׁנֵיהֶם אוֹמְרִים אַ, כְּמוֹ בַּמִּלָּה אַבָּא!',
  vowels:[{n:'קָמַץ',f:L=>L+'ָ',h:'קַו עִם רֶגֶל קְטַנָּה'},{n:'פַּתַח',f:L=>L+'ַ',h:'קַו יָשָׁר'}],
  words:['אַבָּא|👨|אַ-בָּא','סַבָּא|👴|סַ-בָּא','גַּמָּל|🐫|גַּ-מָּל','דָּג|🐟|דָּג','יָד|✋|יָד','כַּף|🥄|כַּף','סַל|🧺|סַל','נָחָשׁ|🐍|נָ-חָשׁ','מַפָּה|🗺️|מַ-פָּה','בָּנָנָה|🍌|בָּ-נָ-נָה','יָם|🌊|יָם','פַּח|🗑️|פַּח','דַּף|📄|דַּף','פָּרָה|🐄|פָּ-רָה','תָּמָר|🌴|תָּ-מָר','חָלָב|🥛|חָ-לָב','שַׁבָּת|🕯️|שַׁ-בָּת','מַגָּף|🥾|מַ-גָּף','צָב|🐢|צָב','אַף|👃|אַף','מַתָּנָה|🎁|מַ-תָּ-נָה','אֲנָנָס|🍍|אֲ-נָ-נָס','בַּת|👧|בַּת','מָרָק|🥣|מָ-רָק'].map(W),
  story:{pic:'👨👴👧',lines:['אַבָּא בָּא.','סַבָּא בָּא.','אַבָּא שָׁתָה חָלָב.','סַבָּא אָכַל בָּנָנָה.','דָּנָה שָׁרָה.'],
   qs:[{q:'מָה אַבָּא שָׁתָה?',opts:['🥛','🍌','🥣'],a:'🥛'},{q:'מָה סַבָּא אָכַל?',opts:['🍍','🍌','🥛'],a:'🍌'},{q:'מִי שָׁרָה?',opts:['דָּנָה','אַבָּא','סַבָּא'],a:'דָּנָה'}]}},
 {animal:'🦉',guide:'ינשופי',title:'חִירִיק',sound:'i',color:'#e3dcff',
  intro:'הוּ הוּ! אֲנִי יַנְשׁוּפִי. הַחִירִיק הוּא נְקֻדָּה אַחַת מִתַּחַת לָאוֹת, וְהוּא אוֹמֵר אִי – כְּמוֹ בַּמִּלָּה פִּיל!',
  vowels:[{n:'חִירִיק',f:L=>L+'ִ',h:'נְקֻדָּה אַחַת לְמַטָּה'},{n:'חִירִיק מָלֵא',f:L=>L+'ִי',h:'נְקֻדָּה וְאַחֲרֶיהָ י'}],
  words:['פִּיל|🐘|פִּיל','תִּירָס|🌽|תִּי-רָס','אִמָּא|👩|אִ-מָּא','מִטָּה|🛏️|מִ-טָּה','גִּיטָרָה|🎸|גִּי-טָ-רָה','סִיר|🍲|סִיר','שִׁנַּיִם|🦷|שִׁ-נַּ-יִם','פִּיצָה|🍕|פִּי-צָה','חִטָּה|🌾|חִ-טָּה','סַכִּין|🔪|סַ-כִּין','תִּיק|🎒|תִּיק','קִיר|🧱|קִיר','שִׁיר|🎵|שִׁיר','עִיר|🏙️|עִיר','תַּנִּין|🐊|תַּ-נִּין','אִישׁ|🧍|אִישׁ','בַּיִת|🏠|בַּ-יִת','מַיִם|💧|מַ-יִם'].map(W),
  story:{pic:'🍕🎵',lines:['אַבָּא קָנָה פִּיצָה.','גִּילִי אָכַל פִּיצָה.','גִּילִי שָׁתָה מַיִם.','אַבָּא שָׁר שִׁיר.'],
   qs:[{q:'מָה אַבָּא קָנָה?',opts:['🌽','🍕','🍲'],a:'🍕'},{q:'מִי אָכַל פִּיצָה?',opts:['אִמָּא','אַבָּא','גִּילִי'],a:'גִּילִי'},{q:'מָה שָׁתָה גִּילִי?',opts:['💧','🥛','🍵'],a:'💧'}]}},
 {animal:'🐼',guide:'פנדי',title:'חוֹלָם',sound:'o',color:'#dff3e4',
  intro:'הַיּוֹ! אֲנִי פַּנְדִּי. הַחוֹלָם הוּא נְקֻדָּה לְמַעְלָה, וְהוּא אוֹמֵר אוֹ – כְּמוֹ בַּמִּלָּה יוֹנָה!',

let heVoice=null,HE_VOICES=[];
function voiceScore(v){
  let s=0;const n=v.name||'';
  if(/natural|neural|online/i.test(n))s+=10;   // Edge: "Hila Online (Natural)" – the most human-sounding
  if(/premium|enhanced|siri/i.test(n))s+=8;    // Apple high-quality voices
  if(/google/i.test(n))s+=4;
  if(/hila|הילה|carmit|כרמית/i.test(n))s+=2;   // softer female voices tend to suit kids
  return s;
}
function pickVoice(){
  try{
    HE_VOICES=speechSynthesis.getVoices().filter(x=>/^he|^iw/i.test(x.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
    heVoice=HE_VOICES.find(v=>v.name===P.voice)||HE_VOICES[0]||null;
  }catch(e){heVoice=null;HE_VOICES=[]}
}
try{pickVoice();speechSynthesis.onvoiceschanged=()=>{const n=HE_VOICES.length;pickVoice();if(HE_VOICES.length!==n&&S.view==='map')render()}}catch(e){}
function speak(t,rate){
  if(!heVoice)return;
  try{
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=heVoice;u.lang=heVoice.lang;
    const slow=P.speed==='slow'?.85:1;
    u.rate=(rate||.85)*slow;u.pitch=P.pitch||1.15;   // slightly higher & slower = friendlier for kids
    speechSynthesis.speak(u);
  }catch(e){}
}

const CLIPS={};let DB=null,curAudio=null;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('kids-reading-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadClips(){
  try{DB=await idb();const req=DB.transaction('clips').objectStore('clips').openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){CLIPS[c.key]=URL.createObjectURL(c.value);c.continue()}else render()}}catch(e){}
}
function putClip(k,blob){
  if(CLIPS[k])URL.revokeObjectURL(CLIPS[k]);CLIPS[k]=URL.createObjectURL(blob);
  try{DB&&DB.transaction('clips','readwrite').objectStore('clips').put(blob,k)}catch(e){}
}
function delClip(k){
  if(CLIPS[k])URL.revokeObjectURL(CLIPS[k]);delete CLIPS[k];
  try{DB&&DB.transaction('clips','readwrite').objectStore('clips').delete(k)}catch(e){}
}

const activeRec=()=>{const id=String(P.narrator).startsWith('rec:')?P.narrator.slice(4):null;return P.voices.some(v=>v.id===id)?id:null};
const ck=(id,k)=>id+'|'+k;
const clipFor=(k,id)=>id?(CLIPS[ck(id,k)]||(id==='v1'?CLIPS[k]:undefined)):undefined;
const voiceCount=id=>Object.keys(CLIPS).filter(k=>k.startsWith(id+'|')||(id==='v1'&&!k.includes('|'))).length;

const activeAI=()=>String(P.narrator).startsWith('ai:')?AIV.find(v=>v.slug===P.narrator.slice(3))||null:null;
const useRec=()=>!!activeRec()||!!activeAI();
function clipUrl(k){const ai=activeAI();if(ai)return ai.files[k]?'audio/'+ai.files[k]:undefined;return clipFor(k,activeRec())}
const hasClip=k=>!!clipUrl(k);

async function loadAI(){
  try{const r=await fetch('audio/voices.json',{cache:'no-cache'});if(!r.ok)return;const m=await r.json();AIV=(m.voices||[]).filter(v=>v.files&&Object.keys(v.files).length);

function totalStars(){return Object.values(P.acts||{}).reduce((a,b)=>a+b,0)}

/* ---------- words & distractors ---------- */
const ALLW=STAGES.flatMap(s=>s.words);
const curWords=()=>S.stage===MIX?ALLW:STAGES[S.stage].words;
const sounds=()=>STAGES.slice(0,Math.min(S.stage,MIX-1)+1).filter(s=>s.sound).map(s=>s.sound);
function draw(key,pool){if(!S.decks[key]||!S.decks[key].length)S.decks[key]=shuffle(pool);return S.decks[key].pop()}
function pickWord(f){
  f=f||(()=>true);
  const cur=curWords().filter(f),rev=(S.stage>0&&S.stage<MIX)?wordsUpTo(S.stage-1).filter(f):[];
  const useRev=rev.length&&(Math.random()<.3||!cur.length);
  return draw((useRev?'r:':'c:')+S.act+':'+f.name,useRev?rev:cur);
}
const MK={'ָ':'a','ַ':'a','ֲ':'a','ִ':'i','ֹ':'o','ֵ':'e','ֶ':'e','ֻ':'u','ְ':'shva'};
const NUC={a:'ַ',i:'ִ',o:'וֹ',e:'ֶ',u:'וּ'};
const SND_LABEL={a:'אַ',i:'אִי',o:'אוֹ',e:'אֶ',u:'אוּ'};
function parseSyl(s){
  let i=1,marks='';while(i<s.length&&/[֑-ׇ]/.test(s[i])){marks+=s[i];i++}
  const v=[...marks].find(c=>MK[c]),other=[...marks].filter(c=>!MK[c]).join(''),rest=s.slice(i);
  if(v)return{head:s[0]+other,nuc:v,snd:MK[v],tail:rest};
  if(rest.startsWith('וֹ'))return{head:s[0]+other,nuc:'וֹ',snd:'o',tail:rest.slice(2)};
  if(rest.startsWith('וּ'))return{head:s[0]+other,nuc:'וּ',snd:'u',tail:rest.slice(2)};
  return{head:s[0]+other,nuc:'',snd:null,tail:rest};
}
const LOOK={'ב':'כ','כ':'ב','ד':'ר','ר':'ד','ה':'ח','ח':'ה','ת':'ח','ג':'נ','נ':'ג','מ':'ט','ט':'מ','ס':'ם','ש':'ע','ע':'צ','צ':'ע','פ':'כ','ק':'ה','ל':'ך','י':'ו','ו':'ז','ז':'ו','א':'ע'};
function sylVariants(s){
  const p=parseSyl(s),out=[];
  const dropY=x=>(p.tail[0]==='י'&&(p.snd==='i'||p.snd==='e')&&x!=='i'&&x!=='e')?p.tail.slice(1):p.tail;
  if(p.snd&&p.snd!=='shva')sounds().forEach(x=>{if(x!==p.snd)out.push(p.head+NUC[x]+dropY(x))});
  const c=s[0];if(LOOK[c]){const n=LOOK[c],keep=[...p.head.slice(1)].filter(m=>m!=='ׁ'&&m!=='ׂ'&&!(m==='ּ'&&'אהחער'.includes(n))).join('');out.push(n+keep+p.nuc+p.tail)}
  return [...new Set(out)].filter(x=>x!==s);
}
function wordVariants(w,n){
  const out=new Set();
  w[2].forEach((s,i)=>sylVariants(s).forEach(v=>{const a=w[2].slice();a[i]=v;out.add(a.join(''))}));
  out.delete(w[0]);ALLW.forEach(x=>out.delete(x[0]));['כּוּס','כוּס','זַיִן','זַין'].forEach(x=>out.delete(x));
  return shuffle([...out]).slice(0,n);
}

/* ---------- rounds ---------- */
function makeListen(){
  const st=STAGES[S.stage];
  if(!st.sound){
    const t=pickWord(x=>canSay(wordKey(x[0])))||rnd(st.words);
    const rest=shuffle(curWords().filter(w=>w!==t));
    return {kind:'listen',say:t[0],key:wordKey(t[0]),answer:t[0],opts:shuffle([t[0],rest[0][0],rest[1][0]])};
  }
  const sayable=LETTERS.filter(x=>canSay(sylKey(st.sound,x)));
  const v=rnd(st.vowels),L=rnd(sayable.length?sayable:LETTERS),target=v.f(L);
  const learned=STAGES.slice(0,S.stage+1).filter(s=>s.sound),cands=[];
  learned.forEach(s=>{if(s.sound!==st.sound)cands.push({t:rnd(s.vowels).f(L),k:L+s.sound})});
  shuffle(LETTERS.filter(x=>x!==L)).slice(0,3).forEach(x=>cands.push({t:rnd(st.vowels).f(x),k:x+st.sound}));
  const seen=new Set([L+st.sound]),d=[];
  for(const c of shuffle(cands)){if(!seen.has(c.k)){seen.add(c.k);d.push(c.t)}if(d.length===2)break}
  return {kind:'listen',say:SAY[st.sound](L),key:sylKey(st.sound,L),answer:target,opts:shuffle([target,...d])};
}
function pictureOpts(t,n){
  const pool=S.stage===MIX?ALLW:wordsUpTo(S.stage);
  return shuffle([t[1],...shuffle(pool.filter(w=>w[1]!==t[1])).slice(0,n-1).map(o=>o[1])]);
}
function makeRead(){const t=pickWord();return {kind:'read',word:t[0],answer:t[1],opts:pictureOpts(t,S.stage>=2?4:3)}}
function makeBuild(){
  const t=pickWord(function multi(x){return x[2].length>1});
  const extra=shuffle([...new Set([...t[2].flatMap(sylVariants),...curWords().flatMap(w=>w[2])])].filter(s=>!t[2].includes(s))).slice(0,S.stage>=2?3:2);
  return {kind:'build',word:t[0],emoji:t[1],syl:t[2],filled:0,tiles:shuffle([...t[2],...extra]).map((s,i)=>({s,i,used:false}))};
}
function makeSpell(){
  let t,v;for(let k=0;k<20;k++){t=pickWord();v=wordVariants(t,S.stage>=2?3:2);if(v.length>=2)break}
  return {kind:'spell',word:t[0],emoji:t[1],answer:t[0],opts:shuffle([t[0],...v])};
}
function makeMissing(){
  let t,i,v;for(let k=0;k<20;k++){t=pickWord(function multi(x){return x[2].length>1});i=Math.floor(Math.random()*t[2].length);v=shuffle(sylVariants(t[2][i])).slice(0,S.stage>=2?3:2);if(v.length>=2)break}
  return {kind:'missing',word:t[0],emoji:t[1],syl:t[2],gap:i,answer:t[2][i],opts:shuffle([t[2][i],...v])};
}
function makeSort(){
  const t=pickWord(function sortable(x){const p=parseSyl(x[2][0]);return !!p.snd&&p.snd!=='shva'});
  const p=parseSyl(t[2][0]);
  return {kind:'sort',word:t[0],syl:t[2],answer:p.snd,opts:sounds()};
}
function makeFlash(){
  const t=pickWord();
  const ms=S.stage===MIX?1400:Math.max(1300,3000-S.stage*300);
  return {kind:'flash',word:t[0],answer:t[1],opts:pictureOpts(t,4),ms,hidden:false};
}
function makeMemory(){
  const ws=[];for(const w of shuffle(curWords().concat(S.stage>0&&S.stage<MIX?wordsUpTo(S.stage-1):[]))){if(!ws.some(x=>x[1]===w[1]))ws.push(w);if(ws.length===6)break}
  const cards=shuffle(ws.flatMap((w,i)=>[{p:i,t:w[0],w:1},{p:i,t:w[1],w:0}])).map((c,i)=>Object.assign(c,{i,up:false,done:false}));
  return {kind:'memory',cards,open:[],moves:0,pairs:0};
}
function listenPossible(){
  if(heVoice)return true;
  const st=STAGES[S.stage];if(!st)return false;
  return st.sound?LETTERS.filter(x=>hasClip(sylKey(st.sound,x))).length>=3:st.words.filter(w=>hasClip(wordKey(w[0]))).length>=3;
}
function newRound(){
  let k=S.act;
  if(k==='mix'){k=rnd(MIX_KINDS)}
  const m={listen:()=>listenPossible()?makeListen():Object.assign(makeListen(),{kind:'match'}),read:makeRead,build:makeBuild,spell:makeSpell,missing:makeMissing,sort:makeSort,flash:makeFlash,memory:makeMemory};
  S.round=m[k]();S.locked=false;
  if(S.round.kind==='flash')scheduleFlash();
}
let flashTimer=null;
function scheduleFlash(){clearTimeout(flashTimer);const r=S.round;flashTimer=setTimeout(()=>{if(S.round===r&&!S.locked){r.hidden=true;render()}},r.ms)}

/* ---------- views ---------- */
function topBar(title,back){
  return `<div class="top"><button class="iconbtn" data-a="home" aria-label="למפה">🏠</button>${back?`<button class="iconbtn" data-a="back" aria-label="חזרה לשלב">↩️</button>`:''}<h1 class="heb">${title}</h1><span class="pill">⭐ ${totalStars()}</span></div>`;
}
function render(){
  if(S.view==='map')return renderMap();
  if(S.view==='studio')return renderStudio();
  if(S.view==='stage')return renderStage();
  const st=STAGES[S.stage]||{animal:'🏆',title:'אֶתְגָּר מְעֹרָב'},d=actDef(S.act);
  let h=topBar(`${d.icon} ${d.name}`,S.stage!==MIX);
  if(S.act==='learn')h+=renderLearn(st);
  else if(S.done)h+=renderDone(st);
  else if(S.act==='story')h+=renderStory(st);
  else h+=renderGame(st);
  app.innerHTML=h;
}
function renderMap(){
  let h=`<div class="top"><h1>📚 קוראים עם החברים</h1><span class="pill">⭐ ${totalStars()}</span></div>
  <p class="sub heb">בְּחַר חָבֵר וְשַׂחֵק! כָּל הַשְּׁלָבִים פְּתוּחִים.</p><div class="map">`;
  STAGES.forEach((s,i)=>{
    const got=stageStars(i),max=stageMax(i);
    h+=`<button class="stage" data-a="open" data-i="${i}">
      <div class="ani" style="background:${s.color}">${s.animal}</div>
      <div><div class="num">שלב ${i+1} · ${s.guide}</div><div class="ttl heb">${s.title}</div>
      <div class="meter"><i style="width:${Math.round(got/max*100)}%"></i></div><div class="num">⭐ ${got}/${max}</div></div></button>`;
  });
  h+=`<button class="stage mixcard" data-a="mix"><div class="ani" style="background:#ffe9a8">🏆</div>
      <div><div class="num">לְאַלּוּפִים</div><div class="ttl heb">אֶתְגָּר מְעֹרָב</div><div class="num">${'⭐'.repeat(starsOf(MIX,'mix'))}${'☆'.repeat(3-starsOf(MIX,'mix'))} · מִלִּים מִכָּל הַשְּׁלָבִים</div></div></button>`;
  h+=`</div>${renderParent()}`;
  app.innerHTML=h;
}

  <div class="voicebox"><b>🎙️ הקריין</b>

      <optgroup label="קולות שהקלטתם">${P.voices.map(v=>`<option value="rec:${v.id}" ${P.narrator==='rec:'+v.id?'selected':''}>🎙️ ${esc(v.name)} (${voiceCount(v.id)} הקלטות)</option>`).join('')}</optgroup>
      ${HE_VOICES.length?`<optgroup label="קולות המכשיר">${HE_VOICES.map(v=>`<option value="tts:${esc(v.name)}" ${!useRec()&&v===heVoice?'selected':''}>🔊 ${esc(v.name)}</option>`).join('')}</optgroup>`:''}
    </select></label>
    <button class="btn ghost small" data-a="testnarr">נסה ▶</button>
    <div>מה שחסר בקול שנבחר (למשל מילים חדשות וסיפורים) יושמע בקול המכשיר.</div>

    <label>מהירות: <select data-c="speed"><option value="normal" ${P.speed!=='slow'?'selected':''}>רגילה</option><option value="slow" ${P.speed==='slow'?'selected':''}>איטית</option></select></label>
    <button class="btn ghost small" data-a="testvoice">נסה ▶</button></div>`

  <p>ההתקדמות נשמרת בדפדפן הזה. <button class="linkbtn" data-a="reset">${S.confirmReset?'בטוח? לחץ שוב כדי למחוק את כל הכוכבים':'לאפס את הכוכבים'}</button></p></details>`;
}
function renderStage(){

function renderLearn(st){
  let h=`<div class="guide"><div class="ani">${st.animal}</div><div class="bubble heb">${canSay('intro:'+S.stage)?`<button class="speak say" data-a="sayintro" aria-label="הקרא">🔊</button>`:''}${esc(st.intro)}</div></div>`;

function progress(n){return `<div class="prog">${Array.from({length:n},(_,i)=>`<i class="${i<S.q?'d':i===S.q?'c':''}"></i>`).join('')}</div>`}
const wtxt=w=>S.stage>=5?hiShva(w):esc(w);
function optBtns(r,cls,fmt){return `<div class="opts ${r.opts.length===4?'four':''} ${cls||''}">${r.opts.map(o=>`<button class="opt ${cls||''}" data-a="pick" data-v="${esc(o)}">${fmt?fmt(o):o}</button>`).join('')}</div>`}

    h+=`<div class="tiles heb">${r.tiles.map(t=>`<button class="tile ${t.used?'used':''}" data-a="tile" data-i="${t.i}">${esc(t.s)}</button>`).join('')}</div>`;
  }else if(r.kind==='memory'){
    h+=`<p class="q heb">מְצָא זוּגוֹת: מִלָּה + תְּמוּנָה 🃏 <span class="note">צְעָדִים: ${r.moves}</span></p><div class="mem">${r.cards.map(c=>`<button class="mcard ${c.up||c.done?'up':''} ${c.done?'done':''}" data-a="mem" data-i="${c.i}">${c.up||c.done?`<span class="${c.w?'heb mw':'me'}">${c.w?wtxt(c.t):c.t}</span>`:'❔'}</button>`).join('')}</div>`;
  }
  h+=`<div class="feedback heb" id="fb"></div></div>`;
  return h;
}
function renderStory(st){
  const s=st.story;
  if(S.storyQ<0){
    return `<div class="panel story"><div class="emoji">${s.pic}</div>${s.lines.map((l,i)=>`<button class="sline heb" data-a="sline" data-i="${i}">${wtxt(l)}</button>`).join('')}
      <p class="note heb">${heVoice||AIV.length?'לְחַץ עַל שׁוּרָה כְּדֵי לִשְׁמֹעַ אוֹתָהּ':''}</p><div class="center"><button class="btn" data-a="storygo">קָרָאתִי! לַשְּׁאֵלוֹת ▶</button></div></div>`;
  }
  const q=s.qs[S.storyQ];S.round={kind:'storyq',answer:q.a,opts:q.opts};
  const isPic=q.opts.every(o=>!/[א-ת]/.test(o));
  return `<div class="panel">${progress(s.qs.length)}<details class="peek"><summary class="heb">📖 לְהָצִיץ בַּסִּפּוּר</summary>${s.lines.map(l=>`<div class="heb">${wtxt(l)}</div>`).join('')}</details>
    <p class="q heb big">${wtxt(q.q)}</p>${optBtns(S.round,isPic?'e':'heb word',isPic?null:wtxt)}<div class="feedback heb" id="fb"></div></div>`;
}
function renderDone(st){
  const s=S.lastStars||1,list=actsFor(S.stage===MIX?0:S.stage).filter(a=>a.n),idx=list.findIndex(a=>a.id===S.act),nx=S.stage!==MIX&&list[idx+1];
  return `<div class="panel center"><div class="done-ani">${st.animal}</div>
  <h2 class="heb" style="font-size:34px;margin:8px 0">כָּל הַכָּבוֹד!</h2>
  <div class="bigstars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px">
  ${nx?`<button class="btn" data-a="act" data-id="${nx.id}">${nx.icon} לַמִּשְׂחָק הַבָּא</button>`:''}
  <button class="btn ghost" data-a="again">עוֹד פַּעַם 🔁</button>
  <button class="btn ghost" data-a="${S.stage===MIX?'home':'back'}">${S.stage===MIX?'לַמַּפָּה 🗺️':'לְכָל הַמִּשְׂחָקִים ↩️'}</button></div></div>`;
}

/* ---------- recording studio ---------- */
const REC={stream:null,mr:null,chunks:[],on:false,err:''};
function renderStudio(){
  const V=S.sVoice,items=studioItems(S.sStage),it=items[S.sIdx],done=items.filter(x=>clipFor(x.k,V)).length;
  let h=`<div class="top"><button class="iconbtn" data-a="home" aria-label="חזרה">🏠</button><h1>🎙️ חדר ההקלטות</h1></div>
  <p class="sub">מקליטים את הקול שלכם, והחיות ידברו בו. דברו <b>ברור ולאט, בחדר שקט</b>, והגו את ההברה בדיוק כמו שכתובה (למשל "מָ" = "מָה"). כדאי להקליט על הטאבלט שהילד משחק בו, כי ההקלטות נשמרות במכשיר שעליו הקלטתם.</p>
  <div class="vbar"><b>מקליטים בקול:</b>
    ${P.voices.map(v=>`<button class="vchip ${v.id===V?'on':''}" data-a="svoice" data-id="${v.id}">🎙️ ${esc(v.name)} <small>${voiceCount(v.id)}</small></button>`).join('')}
    <span class="addv"><input id="newvoice" class="heb" maxlength="20" placeholder="קול חדש, למשל: אמא"><button class="btn small" data-a="addvoice">➕ הוסף</button></span>
    ${P.voices.length>1?`<button class="linkbtn" data-a="delvoice">${S.confirmDel===V?'בטוח? לחץ שוב כדי למחוק את הקול וכל ההקלטות שלו':'🗑 מחק את הקול הזה'}</button>`:''}
  </div>
  <div class="stabs">${STAGES.map((s,i)=>{const its=studioItems(i),d=its.filter(x=>clipFor(x.k,V)).length;return `<button class="stab ${i===S.sStage?'on':''}" data-a="sstage" data-i="${i}">${s.animal} שלב ${i+1}<small>${d}/${its.length}</small></button>`}).join('')}</div>
  <div class="panel center">
    <div class="prog" style="margin-bottom:6px">פריט ${S.sIdx+1} מתוך ${items.length} · הוקלטו ${done}</div>
    ${it.e?`<div style="font-size:54px">${it.e}</div>`:''}
    <div class="heb ${it.small?'rtext':'target'}">${S.sStage===5&&!it.small?hiShva(it.t):esc(it.t)}</div>
    ${it.k.startsWith('syl:')?`<div class="note heb">לְהַגִּיד: ${esc(it.k.slice(4))}</div>`:''}
    <div class="recrow">
      <button class="nav" data-a="sprev" ${S.sIdx===0?'disabled':''} aria-label="הקודם">→</button>
      <button class="recbtn ${REC.on?'on':''}" data-a="rec">${REC.on?'⏹ עצור':'🔴 הקלט'}</button>
      <button class="nav" data-a="snext" ${S.sIdx===items.length-1?'disabled':''} aria-label="הבא">←</button>
    </div>
    <div class="recrow">
      ${clipFor(it.k,V)?`<button class="btn ghost small" data-a="splay">▶ השמע</button><button class="btn ghost small" data-a="sdel">🗑 מחק</button><span class="okmark">✓ מוקלט</span>`:'<span class="note">עוד לא הוקלט</span>'}
    </div>
    ${REC.err?`<p class="try heb" style="color:var(--bad)">${esc(REC.err)}</p>`:''}
  </div>
  <div class="chips heb">${items.map((x,i)=>`<button class="chip ${i===S.sIdx?'on':''} ${clipFor(x.k,V)?'has':''}" data-a="sjump" data-i="${i}">${x.k.startsWith('intro:')?x.e+' פתיח':x.small?'📖 '+esc(x.t.slice(0,12))+'…':esc(x.t)}</button>`).join('')}</div>`;
  app.innerHTML=h;
}
async function toggleRec(){
  if(REC.on){try{REC.mr.stop()}catch(e){}return}
  REC.err='';
  try{
    if(!REC.stream)REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const it=studioItems(S.sStage)[S.sIdx];
    REC.chunks=[];REC.mr=new MediaRecorder(REC.stream);
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
    REC.mr.onstop=()=>{
      REC.on=false;const blob=new Blob(REC.chunks,{type:REC.mr.mimeType||'audio/webm'});
      if(blob.size>800){const kk=ck(S.sVoice,it.k);putClip(kk,blob);if(S.sVoice==='v1'&&CLIPS[it.k])delClip(it.k);stopAudio();curAudio=new Audio(CLIPS[kk]);curAudio.play().catch(()=>{})}
      render();
    };
    REC.mr.start();REC.on=true;stopAudio();render();
  }catch(e){
    REC.on=false;REC.err='לא הצלחתי להפעיל את המיקרופון. צריך לאשר גישה למיקרופון בדפדפן (ולפתוח את המשחק מהקישור הרגיל, לא מתוך צ׳אט).';render();
  }
}

/* ---------- flow ---------- */
function openStage(i){S.view='stage';S.stage=i;S.act=null;S.done=false;stopAudio();render()}
function openAct(id){
  S.view='act';S.act=id;S.q=0;S.mistakes=0;S.done=false;S.storyQ=-1;S.round=null;
  if(id!=='learn'&&id!=='story')newRound();
  render();autoSay();
}
function finishAct(){
  clearTimeout(flashTimer);
  let s;
  if(S.act==='memory'){const extra=S.round.moves-6;s=extra<=3?3:extra<=7?2:1}
  else{const n=actDef(S.act).n,ratio=S.mistakes/n;s=ratio<=.15?3:ratio<=.4?2:1}
  P.acts=P.acts||{};const k=starKey(S.stage,S.act);P.acts[k]=Math.max(P.acts[k]||0,s);
  S.lastStars=s;S.done=true;save();render();confetti();say('praise',PRAISE[0]);
}
function autoSay(){const r=S.round;if(!r)return;if(r.kind==='listen')setTimeout(()=>say(r.key,r.say),350)}
function feedback(ok){
  const fb=document.getElementById('fb');if(!fb)return;
  fb.className='feedback heb '+(ok?'good':'try');fb.textContent=ok?rnd(PRAISE):rnd(TRY);
}
function advance(){
  if(S.act==='story'){S.storyQ++;S.q++;if(S.storyQ>=STAGES[S.stage].story.qs.length)return finishAct();render();return}
  S.q++;
  if(S.q>=actDef(S.act).n)return finishAct();
  newRound();render();autoSay();
}
function wrong(b){S.mistakes++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');feedback(false)}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='home'){if(REC.on)return;clearTimeout(flashTimer);S.view='map';S.confirmReset=false;stopAudio();render();return}
  if(a==='studio'){S.view='studio';S.sVoice=activeRec()||P.voices[0].id;S.confirmDel=null;S.sStage=S.sStage||0;S.sIdx=0;REC.err='';render();return}
  if(a==='rec'){toggleRec();return}
  if(REC.on)return;
  if(a==='sstage'){S.sStage=+b.dataset.i;S.sIdx=0;render();return}
  if(a==='sjump'){S.sIdx=+b.dataset.i;render();return}
  if(a==='sprev'){if(S.sIdx>0)S.sIdx--;render();return}
  if(a==='snext'){if(S.sIdx<studioItems(S.sStage).length-1)S.sIdx++;render();return}
  if(a==='splay'){const u=clipFor(studioItems(S.sStage)[S.sIdx].k,S.sVoice);stopAudio();if(u){curAudio=new Audio(u);curAudio.play().catch(()=>{})}return}
  if(a==='sdel'){const k=studioItems(S.sStage)[S.sIdx].k;delClip(ck(S.sVoice,k));if(S.sVoice==='v1')delClip(k);render();return}
  if(a==='svoice'){S.sVoice=b.dataset.id;S.confirmDel=null;render();return}
  if(a==='addvoice'){const inp=document.getElementById('newvoice');const name=(inp&&inp.value||'').trim();if(!name){inp&&inp.focus();return}
    const id='v'+Date.now().toString(36);P.voices.push({id,name});S.sVoice=id;P.narrator='rec:'+id;P.narratorSet=true;save();render();return}
  if(a==='delvoice'){const id=S.sVoice;if(S.confirmDel!==id){S.confirmDel=id;render();return}
    Object.keys(CLIPS).filter(k=>k.startsWith(id+'|')||(id==='v1'&&!k.includes('|'))).forEach(delClip);
    P.voices=P.voices.filter(v=>v.id!==id);if(P.narrator==='rec:'+id)P.narrator='rec:'+P.voices[0].id;S.sVoice=P.voices[0].id;S.confirmDel=null;save();render();return}
  if(a==='sayk'){say(b.dataset.k,b.dataset.t);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),400);return}
  if(a==='open'){openStage(+b.dataset.i);return}
  if(a==='mix'){S.stage=MIX;openAct('mix');return}
  if(a==='act'){openAct(b.dataset.id);return}
  if(a==='back'){clearTimeout(flashTimer);openStage(S.stage);return}
  if(a==='again'){openAct(S.act);return}
  if(a==='reset'){if(!S.confirmReset){S.confirmReset=true;render();return}P.acts={};S.confirmReset=false;save();render();return}
  if(a==='testnarr'){say('intro:0',STAGES[0].intro,.9);return}
  if(a==='testvoice'){speak('שָׁלוֹם! אֲנִי אַרְנָבִי. בּוֹא נִקְרָא יַחַד: אַבָּא, סַבָּא, גַּמָּל!',.9);return}
  if(a==='sayintro'){say('intro:'+S.stage,STAGES[S.stage].intro,.9);return}
  if(a==='sline'){const l=STAGES[S.stage].story.lines[+b.dataset.i];say('st:'+l,l,.85);document.querySelectorAll('.sline').forEach(x=>x.classList.remove('on'));b.classList.add('on');return}
  if(a==='storygo'){S.storyQ=0;S.q=0;render();return}
  const r=S.round;if(!r)return;
  if(a==='replay'){if(r.kind==='build')say(wordKey(r.word),r.word);else say(r.key,r.say);return}
  if(a==='flashshow'){S.mistakes++;r.hidden=false;render();scheduleFlash();return}
  if(a==='pick'){
    if(S.locked)return;
    if(b.dataset.v===r.answer){
      S.locked=true;clearTimeout(flashTimer);
      if(r.kind==='missing'||r.kind==='flash'){if(r.kind==='flash')r.hidden=false;render();const nb=document.querySelector(`[data-a=pick][data-v="${CSS.escape(r.answer)}"]`);nb&&nb.classList.add('ok')}
      else b.classList.add('ok');
      feedback(true);
      if(r.word&&r.kind!=='sort')say(wordKey(r.word),r.word);
      setTimeout(advance,1200);
    }else{
      wrong(b);
      if(r.kind==='listen')setTimeout(()=>say(r.key,r.say),500);
    }
    return;
  }
  if(a==='tile'){
    if(S.locked)return;
    const t=r.tiles[+b.dataset.i];if(t.used)return;
    if(t.s===r.syl[r.filled]){
      t.used=true;r.filled++;
      if(r.filled===r.syl.length){S.locked=true;render();feedback(true);say(wordKey(r.word),r.word);setTimeout(advance,1400)}
      else render();
    }else wrong(b);
    return;
  }
  if(a==='mem'){
    if(S.locked)return;
    const c=r.cards[+b.dataset.i];if(c.up||c.done)return;
    c.up=true;r.open.push(c);
    if(r.open.length===2){
      r.moves++;const [x,y]=r.open;
      if(x.p===y.p&&x.w!==y.w){
        x.done=y.done=true;r.open=[];r.pairs++;S.q=r.pairs;
        const w=x.w?x.t:y.t;say(wordKey(w),w);
        render();feedback(true);
        if(r.pairs===6){S.locked=true;setTimeout(finishAct,1300)}
      }else{
        S.locked=true;render();
        setTimeout(()=>{x.up=y.up=false;r.open=[];S.locked=false;render()},1000);
      }
    }else render();
  }
});

app.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.c;if(!c)return;
  if(c==='voice'){P.voice=e.target.value;pickVoice()}
  if(c==='pitch')P.pitch=parseFloat(e.target.value);
  if(c==='speed')P.speed=e.target.value;
  if(c==='narrator'){const v=e.target.value;P.narratorSet=true;if(v.startsWith('tts:')){P.narrator='tts';P.voice=v.slice(4);pickVoice();save();render();speak('שָׁלוֹם! בּוֹא נִקְרָא יַחַד.',.9);return}P.narrator=v;save();render();preloadAI();say('praise',PRAISE[0]);return}
  save();speak('שָׁלוֹם! בּוֹא נִקְרָא יַחַד.',.9);
});
render();
loadClips();
loadAI();
if(location.protocol==='https:'&&/github\.io$/.test(location.hostname)){try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
