<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קוראים עם החברים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ff8a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קוראים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff6e5; --bg2:#e6f4ff; --ink:#2b2d42; --muted:#6b7086;
  --ok:#2bb673; --bad:#ef5b5b; --card:#ffffff; --shadow:0 6px 0 rgba(43,45,66,.12);
  --accent:#ff8a5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Rubik","Noto Sans Hebrew",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg2),var(--bg1) 70%);min-height:100vh;
}
.heb{font-family:"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:clamp(22px,4.5vw,34px);margin:0;flex:1;font-weight:800}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:700;font-size:18px}
.iconbtn{background:var(--card);width:52px;height:52px;border-radius:16px;box-shadow:var(--shadow);font-size:26px;display:grid;place-items:center}
.iconbtn:active,.btn:active,.opt:active,.tile:active,.stage:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,45,66,.12)}

/* map */
.sub{color:var(--muted);margin:0 0 18px;font-size:18px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.stage{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);text-align:right;display:flex;gap:14px;align-items:center;position:relative;border:4px solid transparent}
.stage .ani{font-size:56px;line-height:1;width:76px;height:76px;border-radius:20px;display:grid;place-items:center}
.stage .num{font-size:15px;color:var(--muted);font-weight:700}
.stage .ttl{font-size:26px;font-weight:800;margin:2px 0}
.stage .stars{font-size:20px;letter-spacing:2px}
.stage.locked{opacity:.55;filter:grayscale(.7)}
.stage.locked::after{content:"🔒";position:absolute;left:14px;top:12px;font-size:24px}
.stage.next{border-color:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.parent{margin-top:28px;background:rgba(255,255,255,.7);border-radius:18px;padding:14px 18px;color:var(--muted);font-size:15px;line-height:1.6}
.parent summary{cursor:pointer;font-weight:700;color:var(--ink)}
.voicebox{background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--ink)}
.voicebox>div{flex-basis:100%;color:var(--muted)}
.voicebox select{font:inherit;font-size:15px;padding:4px 6px;border-radius:8px;border:1px solid #ccd;max-width:220px}
.btn.small{font-size:16px;padding:6px 14px;border-radius:12px}
.stabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stab{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center}
.stab small{color:var(--muted);font-weight:500}
.stab.on{outline:3px solid var(--accent)}
.rtext{font-size:22px;line-height:1.6;margin:8px 0}
.recrow{display:flex;gap:14px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.recbtn{background:var(--bad);color:#fff;font-weight:800;font-size:26px;border-radius:999px;padding:16px 34px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.recbtn.on{background:#2b2d42;animation:pulse 1s infinite}
.nav{background:#fff;border-radius:50%;width:58px;height:58px;font-size:28px;box-shadow:var(--shadow)}
.nav:disabled{opacity:.3}
.okmark{color:var(--ok);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:#fff;border-radius:12px;padding:6px 12px;font-size:20px;border:2px solid #eef0f6}
.chip.has{border-color:var(--ok);background:#e7f8ef}
.chip.on{outline:3px solid var(--accent)}
.vbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.vchip{background:#f3f4fa;border-radius:999px;padding:6px 14px;font-weight:700;border:2px solid transparent}
.vchip small{color:var(--muted)}
.vchip.on{border-color:var(--accent);background:#fff1ea}
.addv{display:inline-flex;gap:6px;align-items:center}
.addv input{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px;border:1px solid #ccd;width:170px}
.linkbtn{text-decoration:underline;color:var(--ink);font-weight:700}

/* lesson */
.guide{display:flex;gap:14px;align-items:flex-start;margin:6px 0 18px}
.guide .ani{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.bubble{background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);font-size:21px;line-height:1.5;position:relative;flex:1}
.bubble::before{content:"";position:absolute;right:-12px;top:22px;border:12px solid transparent;border-left-color:var(--card);border-right:0}
.bubble .say{float:left;margin-right:8px}
.panel{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.vowels{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.vowel{border-radius:20px;padding:10px 18px;text-align:center;min-width:150px}
.vowel .mark{font-size:84px;line-height:1.15;font-weight:800}
.vowel .vn{font-size:22px;font-weight:800}
.vowel .vh{font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:18px;box-shadow:var(--shadow);font-size:clamp(34px,7vw,50px);font-weight:800;padding:8px 0;border:3px solid #eef0f6;line-height:1.35}
.tile.flash{background:#fff3c4}
.wordrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wordcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px 16px;border:3px solid #eef0f6;text-align:center}
.wordcard .e{font-size:40px}
.wordcard .w{font-size:36px;font-weight:800}
.shva{color:#e0457b}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;font-weight:800;font-size:24px;border-radius:20px;padding:14px 28px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.center{text-align:center}
.steps{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.steps span{width:46px;height:10px;border-radius:9px;background:#d9dceb}
.steps span.on{background:var(--accent)}
.steps span.done{background:var(--ok)}

/* games */
.q{font-size:24px;font-weight:700;text-align:center;margin:4px 0 14px}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.prog i{width:14px;height:14px;border-radius:50%;background:#d9dceb;display:block}
.prog i.d{background:var(--ok)}
.prog i.c{background:var(--accent)}
.target{font-size:clamp(70px,16vw,120px);font-weight:800;text-align:center;line-height:1.25;margin:4px 0 10px}
.emoji{font-size:clamp(80px,18vw,120px);text-align:center;line-height:1.1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.opt{background:#fff;border-radius:22px;box-shadow:var(--shadow);border:4px solid #eef0f6;font-size:clamp(46px,10vw,70px);font-weight:800;padding:12px 0;line-height:1.3}
.opt.e{font-size:clamp(56px,12vw,84px)}
.opt.ok,.tile.ok{border-color:var(--ok);background:#e7f8ef}
.opt.bad,.tile.bad{border-color:var(--bad);background:#fdeaea;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;gap:10px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
.slot{min-width:92px;height:96px;border-radius:18px;border:4px dashed #c9cde0;display:grid;place-items:center;font-size:clamp(40px,9vw,58px);font-weight:800;background:rgba(255,255,255,.6)}
.slot.f{border-style:solid;border-color:var(--ok);background:#e7f8ef}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tiles .tile{min-width:96px;padding:8px 14px}
.tile.used{visibility:hidden}
.feedback{min-height:40px;text-align:center;font-size:26px;font-weight:800;margin-top:14px}
.feedback.good{color:var(--ok)}
.feedback.try{color:var(--bad)}
.speak{background:#fff;border-radius:50%;width:64px;height:64px;font-size:30px;box-shadow:var(--shadow);display:inline-grid;place-items:center}
.speak.big{width:96px;height:96px;font-size:46px}
.done-ani{font-size:110px;animation:bob 1.6s infinite}
.bigstars{font-size:64px;letter-spacing:6px}
.confetti{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.note{font-size:15px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- data ---------- */
const LETTERS=['מ','ל','ס','נ','ר','ד','בּ','ת','שׁ','פּ','ג','ז'];
const SAY={a:L=>L+'ָה',i:L=>L+'ִי',o:L=>L+'וֹ',e:L=>L+'ֶה',u:L=>L+'וּ'};
const STAGES=[
 {animal:'🐰',guide:'ארנבי',title:'קָמַץ וּפַתַח',sound:'a',color:'#ffd9c7',
  intro:'שָׁלוֹם! אֲנִי אַרְנָבִי. הַקָּמַץ וְהַפַּתַח הֵם חֲבֵרִים טוֹבִים – שְׁנֵיהֶם אוֹמְרִים אַ, כְּמוֹ בַּמִּלָּה אַבָּא!',
  vowels:[{n:'קָמַץ',f:L=>L+'ָ',h:'קַו עִם רֶגֶל קְטַנָּה'},{n:'פַּתַח',f:L=>L+'ַ',h:'קַו יָשָׁר'}],
  words:[['אַבָּא','👨',['אַ','בָּא']],['סַבָּא','👴',['סַ','בָּא']],['גַּמָּל','🐫',['גַּ','מָּל']],['דָּג','🐟',['דָּג']],['יָד','✋',['יָד']],['כַּף','🥄',['כַּף']],['סַל','🧺',['סַל']],['נָחָשׁ','🐍',['נָ','חָשׁ']],['מַפָּה','🗺️',['מַ','פָּה']],['בָּנָנָה','🍌',['בָּ','נָ','נָה']],['יָם','🌊',['יָם']]]},
 {animal:'🦉',guide:'ינשופי',title:'חִירִיק',sound:'i',color:'#e3dcff',
  intro:'הוּ הוּ! אֲנִי יַנְשׁוּפִי. הַחִירִיק הוּא נְקֻדָּה אַחַת מִתַּחַת לָאוֹת, וְהוּא אוֹמֵר אִי – כְּמוֹ בַּמִּלָּה פִּיל!',
  vowels:[{n:'חִירִיק',f:L=>L+'ִ',h:'נְקֻדָּה אַחַת לְמַטָּה'},{n:'חִירִיק מָלֵא',f:L=>L+'ִי',h:'נְקֻדָּה וְאַחֲרֶיהָ י'}],
  words:[['פִּיל','🐘',['פִּיל']],['תִּירָס','🌽',['תִּי','רָס']],['אִמָּא','👩',['אִ','מָּא']],['מִטָּה','🛏️',['מִ','טָּה']],['גִּיטָרָה','🎸',['גִּי','טָ','רָה']],['סִיר','🍲',['סִיר']],['שִׁנַּיִם','🦷',['שִׁ','נַּ','יִם']],['פִּיצָה','🍕',['פִּי','צָה']]]},
 {animal:'🐼',guide:'פנדי',title:'חוֹלָם',sound:'o',color:'#dff3e4',
  intro:'הַיּוֹ! אֲנִי פַּנְדִּי. הַחוֹלָם הוּא נְקֻדָּה לְמַעְלָה, וְהוּא אוֹמֵר אוֹ – כְּמוֹ בַּמִּלָּה יוֹנָה!',
  vowels:[{n:'חוֹלָם מָלֵא',f:L=>L+'וֹ',h:'ו עִם נְקֻדָּה עַל הָרֹאשׁ'},{n:'חוֹלָם חָסֵר',f:L=>L+'ֹ',h:'נְקֻדָּה לְמַעְלָה'}],
  words:[['צִפּוֹר','🐦',['צִ','פּוֹר']],['יוֹנָה','🕊️',['יוֹ','נָה']],['תּוֹף','🥁',['תּוֹף']],['כּוֹבַע','🎩',['כּוֹ','בַע']],['שׁוֹקוֹלָד','🍫',['שׁוֹ','קוֹ','לָד']],['בַּלּוֹן','🎈',['בַּ','לּוֹן']],['מוֹנִית','🚕',['מוֹ','נִית']],['חַלּוֹן','🪟',['חַ','לּוֹן']]]},
 {animal:'🐘',guide:'פילי',title:'צֵירֵי וּסֶגּוֹל',sound:'e',color:'#d9eefc',
  intro:'טְרוּ טְרוּ! אֲנִי פִּילִי. הַצֵּירֵי וְהַסֶּגּוֹל אוֹמְרִים אֶ – כְּמוֹ בַּמִּלָּה עֵץ!',
  vowels:[{n:'צֵירֵי',f:L=>L+'ֵ',h:'שְׁתֵּי נְקֻדּוֹת שׁוֹכְבוֹת'},{n:'סֶגּוֹל',f:L=>L+'ֶ',h:'שָׁלוֹשׁ נְקֻדּוֹת כְּמוֹ מְשֻׁלָּשׁ'}],
  words:[['עֵץ','🌳',['עֵץ']],['כִּסֵּא','🪑',['כִּ','סֵּא']],['בֵּיצָה','🥚',['בֵּי','צָה']],['כֶּלֶב','🐕',['כֶּ','לֶב']],['סֵפֶר','📖',['סֵ','פֶר']],['גֶּשֶׁם','🌧️',['גֶּ','שֶׁם']],['שֶׁמֶשׁ','☀️',['שֶׁ','מֶשׁ']],['דֶּלֶת','🚪',['דֶּ','לֶת']],['לֶחֶם','🍞',['לֶ','חֶם']]]},
 {animal:'🐢',guide:'צבי',title:'שׁוּרוּק וְקֻבּוּץ',sound:'u',color:'#fff1bf',
  intro:'שָׁלוֹם, אֲנִי צְבִי הַצָּב. הַשּׁוּרוּק וְהַקֻּבּוּץ אוֹמְרִים אוּ – כְּמוֹ בַּמִּלָּה סוּס!',
  vowels:[{n:'שׁוּרוּק',f:L=>L+'וּ',h:'ו עִם נְקֻדָּה בַּבֶּטֶן'},{n:'קֻבּוּץ',f:L=>L+'ֻ',h:'שָׁלוֹשׁ נְקֻדּוֹת בַּאֲלַכְסוֹן'}],
  words:[['סוּס','🐴',['סוּס']],['חָתוּל','🐈',['חָ','תוּל']],['תַּפּוּחַ','🍎',['תַּ','פּוּ','חַ']],['כַּדּוּר','⚽',['כַּ','דּוּר']],['קוּף','🐒',['קוּף']],['שׁוּעָל','🦊',['שׁוּ','עָל']],['דֻּבִּי','🧸',['דֻּ','בִּי']],['אוֹטוֹבּוּס','🚌',['אוֹ','טוֹ','בּוּס']]]},
 {animal:'🦁',guide:'אריק',title:'שְׁוָא',sound:null,color:'#ffe0ec',
  intro:'רוֹאָר! אֲנִי אֲרִיק הָאַרְיֵה. הַשְּׁוָא הוּא שְׁתֵּי נְקֻדּוֹת עוֹמְדוֹת. לִפְעָמִים הוּא שָׁקֵט, וְלִפְעָמִים הוּא אוֹמֵר אֶ קְצָרָה – כְּמוֹ בַּמִּלָּה אַרְנָב!',
  vowels:[{n:'שְׁוָא',f:L=>L+'ְ',h:'שְׁתֵּי נְקֻדּוֹת עוֹמְדוֹת'}],
  words:[['אַרְנָב','🐇',['אַרְ','נָב']],['נְמָלָה','🐜',['נְ','מָ','לָה']],['סַבְתָּא','👵',['סַבְ','תָּא']],['מַזְלֵג','🍴',['מַזְ','לֵג']],['צְפַרְדֵּעַ','🐸',['צְ','פַרְ','דֵּ','עַ']],['תַּרְנְגוֹל','🐓',['תַּרְ','נְ','גוֹל']],['פַּרְפַּר','🦋',['פַּרְ','פַּר']],['דְּבוֹרָה','🐝',['דְּ','בוֹ','רָה']]]}
];
const PRAISE=['כָּל הַכָּבוֹד!','מְעֻלֶּה!','אַלּוּף!','יוֹפִי!','נִהְדָּר!','אֵיזֶה קוֹרֵא!'];
const TRY=['כִּמְעַט! נַסֵּה שׁוּב 🙂','לֹא נוֹרָא, עוֹד פַּעַם!'];

/* ---------- storage (optional) ---------- */
const KEY='kids-reading-v1';
let P={unlocked:1,stars:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.unlocked)P=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}

/* ---------- speech ---------- */
let heVoice=null,HE_VOICES=[];
function voiceScore(v){
  let s=0;const n=v.name||'';
  if(/natural|neural|online/i.test(n))s+=10;   // Edge: "Hila Online (Natural)" – the most human-sounding
  if(/premium|enhanced|siri/i.test(n))s+=8;    // Apple high-quality voices
  if(/google/i.test(n))s+=4;
  if(/hila|הילה|carmit|כרמית/i.test(n))s+=2;   // softer female voices tend to suit kids
  return s;
}
function pickVoice(){
  try{
    HE_VOICES=speechSynthesis.getVoices().filter(x=>/^he|^iw/i.test(x.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
    heVoice=HE_VOICES.find(v=>v.name===P.voice)||HE_VOICES[0]||null;
  }catch(e){heVoice=null;HE_VOICES=[]}
}
try{pickVoice();speechSynthesis.onvoiceschanged=()=>{const n=HE_VOICES.length;pickVoice();if(HE_VOICES.length!==n&&S.view==='map')render()}}catch(e){}
function speak(t,rate){
  if(!heVoice)return;
  try{
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=heVoice;u.lang=heVoice.lang;
    const slow=P.speed==='slow'?.85:1;
    u.rate=(rate||.85)*slow;u.pitch=P.pitch||1.15;   // slightly higher & slower = friendlier for kids
    speechSynthesis.speak(u);

}

/* ---------- recorded narrator (a real human voice, saved on this device) ---------- */
const CLIPS={};let DB=null,curAudio=null;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('kids-reading-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadClips(){
  try{DB=await idb();const req=DB.transaction('clips').objectStore('clips').openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){CLIPS[c.key]=URL.createObjectURL(c.value);c.continue()}else render()}}catch(e){}
}
function putClip(k,blob){
  if(CLIPS[k])URL.revokeObjectURL(CLIPS[k]);CLIPS[k]=URL.createObjectURL(blob);
  try{DB&&DB.transaction('clips','readwrite').objectStore('clips').put(blob,k)}catch(e){}
}
function delClip(k){
  if(CLIPS[k])URL.revokeObjectURL(CLIPS[k]);delete CLIPS[k];
  try{DB&&DB.transaction('clips','readwrite').objectStore('clips').delete(k)}catch(e){}
}
if(!Array.isArray(P.voices)||!P.voices.length)P.voices=[{id:'v1',name:'הקול שלי'}];
if(!P.narrator||P.narrator==='rec')P.narrator='rec:'+P.voices[0].id;
const activeRec=()=>{const id=String(P.narrator).startsWith('rec:')?P.narrator.slice(4):null;return P.voices.some(v=>v.id===id)?id:null};
const ck=(id,k)=>id+'|'+k;
const clipFor=(k,id)=>id?(CLIPS[ck(id,k)]||(id==='v1'?CLIPS[k]:undefined)):undefined;
const voiceCount=id=>Object.keys(CLIPS).filter(k=>k.startsWith(id+'|')||(id==='v1'&&!k.includes('|'))).length;
const useRec=()=>!!activeRec();
const hasClip=k=>!!clipFor(k,activeRec());
const canSay=k=>hasClip(k)||!!heVoice;
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}}
function say(key,text,rate){
  stopAudio();
  if(hasClip(key)){curAudio=new Audio(clipFor(key,activeRec()));curAudio.play().catch(()=>{});return}
  speak(text,rate);
}
const sylKey=(sound,L)=>'syl:'+SAY[sound](L);
const wordKey=w=>'w:'+w;
function studioItems(i){
  const st=STAGES[i],items=[{k:'intro:'+i,t:st.intro,small:true,e:st.animal}];
  if(st.sound)LETTERS.forEach(L=>items.push({k:sylKey(st.sound,L),t:st.vowels[0].f(L)}));
  st.words.forEach(w=>items.push({k:wordKey(w[0]),t:w[0],e:w[1]}));
  if(i===0)items.push({k:'praise',t:PRAISE[0],e:'🎉'});
  return items;
}

/* ---------- helpers ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wordsUpTo(n){let w=[];for(let i=0;i<=n;i++)w=w.concat(STAGES[i].words);return w}
function hiShva(w){return esc(w).replace(/([א-ת][ּׁׂ]*ְ)/g,'<span class="shva">$1</span>')}
function confetti(){const e=['⭐','🎉','✨','🌟','🎈'];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='confetti';d.textContent=rnd(e);d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.6+Math.random()*1.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}

/* ---------- state ---------- */
const S={view:'map',stage:0,step:0,q:0,mistakes:0,round:null};
const STEPS=['learn','listen','read','build','done'];
const COUNTS={listen:6,read:6,build:4};
const app=document.getElementById('app');

function totalStars(){return Object.values(P.stars).reduce((a,b)=>a+b,0)}

/* ---------- rounds ---------- */
function makeListen(){
  const st=STAGES[S.stage];
  if(!st.sound){ // shva stage: words
    const said=shuffle(st.words.filter(w=>canSay(wordKey(w[0]))));const t=said[0]||st.words[0];
    const rest=shuffle(st.words.filter(w=>w!==t));
    return {kind:'listen',say:t[0],key:wordKey(t[0]),answer:t[0],opts:shuffle([t[0],rest[0][0],rest[1][0]])};
  }
  const sayable=LETTERS.filter(x=>canSay(sylKey(st.sound,x)));
  const v=rnd(st.vowels),L=rnd(sayable.length?sayable:LETTERS),target=v.f(L);
  const learned=STAGES.slice(0,S.stage+1).filter(s=>s.sound);
  const cands=[];
  learned.forEach(s=>{if(s.sound!==st.sound)cands.push({t:rnd(s.vowels).f(L),k:L+s.sound})});
  shuffle(LETTERS.filter(x=>x!==L)).slice(0,3).forEach(x=>cands.push({t:rnd(st.vowels).f(x),k:x+st.sound}));
  const seen=new Set([L+st.sound]),d=[];
  for(const c of shuffle(cands)){if(!seen.has(c.k)){seen.add(c.k);d.push(c.t)}if(d.length===2)break}
  return {kind:'listen',say:SAY[st.sound](L),key:sylKey(st.sound,L),answer:target,opts:shuffle([target,...d])};
}
function makeRead(){
  const cur=STAGES[S.stage].words,all=wordsUpTo(S.stage);
  const t=Math.random()<.75?rnd(cur):rnd(all);
  const others=shuffle(all.filter(w=>w[1]!==t[1])).slice(0,2);
  return {kind:'read',word:t[0],answer:t[1],opts:shuffle([t[1],...others.map(o=>o[1])])};
}
function makeBuild(used){
  const st=STAGES[S.stage];
  let pool=st.words.filter(w=>w[2].length>1&&!used.includes(w[0]));
  if(!pool.length)pool=st.words.filter(w=>w[2].length>1);
  const t=rnd(pool);
  const extra=shuffle(wordsUpTo(S.stage).flatMap(w=>w[2]).filter(s=>!t[2].includes(s))).filter((s,i,a)=>a.indexOf(s)===i).slice(0,2);
  const tiles=shuffle([...t[2],...extra]).map((s,i)=>({s,i,used:false}));
  return {kind:'build',word:t[0],emoji:t[1],syl:t[2],filled:0,tiles};
}
function listenPossible(){
  if(heVoice)return true;
  const st=STAGES[S.stage];
  return st.sound?LETTERS.filter(x=>hasClip(sylKey(st.sound,x))).length>=3:st.words.filter(w=>hasClip(wordKey(w[0]))).length>=3;
}
function newRound(){
  const k=STEPS[S.step];
  if(k==='listen')S.round=listenPossible()?makeListen():Object.assign(makeListen(),{kind:'match'});
  else if(k==='read')S.round=makeRead();
  else if(k==='build'){S.usedBuild=S.usedBuild||[];S.round=makeBuild(S.usedBuild);S.usedBuild.push(S.round.word)}
  S.locked=false;
}

/* ---------- views ---------- */
function render(){

  const st=STAGES[S.stage],k=STEPS[S.step];

  h+=`<div class="steps">${STEPS.slice(0,4).map((s,i)=>`<span class="${i<S.step?'done':i===S.step?'on':''}"></span>`).join('')}</div>`;

  app.innerHTML=h;
}

    <div class="recrow">
      <button class="nav" data-a="sprev" ${S.sIdx===0?'disabled':''} aria-label="הקודם">→</button>
      <button class="recbtn ${REC.on?'on':''}" data-a="rec">${REC.on?'⏹ עצור':'🔴 הקלט'}</button>
      <button class="nav" data-a="snext" ${S.sIdx===items.length-1?'disabled':''} aria-label="הבא">←</button>
    </div>
    <div class="recrow">
      ${clipFor(it.k,V)?`<button class="btn ghost small" data-a="splay">▶ השמע</button><button class="btn ghost small" data-a="sdel">🗑 מחק</button><span class="okmark">✓ מוקלט</span>`:'<span class="note">עוד לא הוקלט</span>'}
    </div>
    ${REC.err?`<p class="try heb" style="color:var(--bad)">${esc(REC.err)}</p>`:''}
  </div>
  <div class="chips heb">${items.map((x,i)=>`<button class="chip ${i===S.sIdx?'on':''} ${clipFor(x.k,V)?'has':''}" data-a="sjump" data-i="${i}">${x.small?x.e+' פתיח':esc(x.t)}</button>`).join('')}</div>`;
  app.innerHTML=h;
}
async function toggleRec(){
  if(REC.on){try{REC.mr.stop()}catch(e){}return}
  REC.err='';
  try{
    if(!REC.stream)REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const it=studioItems(S.sStage)[S.sIdx];
    REC.chunks=[];REC.mr=new MediaRecorder(REC.stream);
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
    REC.mr.onstop=()=>{
      REC.on=false;const blob=new Blob(REC.chunks,{type:REC.mr.mimeType||'audio/webm'});
      if(blob.size>800){const kk=ck(S.sVoice,it.k);putClip(kk,blob);if(S.sVoice==='v1'&&CLIPS[it.k])delClip(it.k);stopAudio();curAudio=new Audio(CLIPS[kk]);curAudio.play().catch(()=>{})}
      render();
    };
    REC.mr.start();REC.on=true;stopAudio();render();
  }catch(e){
    REC.on=false;REC.err='לא הצלחתי להפעיל את המיקרופון. צריך לאשר גישה למיקרופון בדפדפן (ולפתוח את המשחק מהקישור הרגיל, לא מתוך צ׳אט).';render();
  }
}

/* ---------- flow ---------- */
function openStage(i){S.view='stage';S.stage=i;S.step=0;S.q=0;S.mistakes=0;S.usedBuild=[];render()}
function nextStep(){
  S.step++;S.q=0;
  if(STEPS[S.step]==='done'){
    const s=S.mistakes<=2?3:S.mistakes<=6?2:1;
    P.stars[S.stage]=Math.max(P.stars[S.stage]||0,s);
    if(P.unlocked<S.stage+2)P.unlocked=Math.min(STAGES.length,S.stage+2);
    save();render();confetti();say('praise',PRAISE[0]);return;
  }
  newRound();render();autoSay();
}
function autoSay(){const r=S.round;if(!r)return;if(r.kind==='listen')setTimeout(()=>say(r.key,r.say),350)}
function feedback(ok){
  const fb=document.getElementById('fb');if(!fb)return;
  fb.className='feedback heb '+(ok?'good':'try');fb.textContent=ok?rnd(PRAISE):rnd(TRY);
}
function advance(){
  S.q++;
  if(S.q>=COUNTS[STEPS[S.step]])return nextStep();
  newRound();render();autoSay();
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='home'){if(REC.on)return;S.view='map';stopAudio();render();return}
  if(a==='studio'){S.view='studio';S.sVoice=activeRec()||P.voices[0].id;S.confirmDel=null;S.sStage=S.sStage||0;S.sIdx=0;REC.err='';render();return}
  if(a==='rec'){toggleRec();return}
  if(REC.on)return;
  if(a==='sstage'){S.sStage=+b.dataset.i;S.sIdx=0;render();return}
  if(a==='sjump'){S.sIdx=+b.dataset.i;render();return}
  if(a==='sprev'){if(S.sIdx>0)S.sIdx--;render();return}
  if(a==='snext'){if(S.sIdx<studioItems(S.sStage).length-1)S.sIdx++;render();return}
  if(a==='splay'){const u=clipFor(studioItems(S.sStage)[S.sIdx].k,S.sVoice);stopAudio();if(u){curAudio=new Audio(u);curAudio.play().catch(()=>{})}return}
  if(a==='sdel'){const k=studioItems(S.sStage)[S.sIdx].k;delClip(ck(S.sVoice,k));if(S.sVoice==='v1')delClip(k);render();return}
  if(a==='svoice'){S.sVoice=b.dataset.id;S.confirmDel=null;render();return}
  if(a==='addvoice'){const inp=document.getElementById('newvoice');const name=(inp&&inp.value||'').trim();if(!name){inp&&inp.focus();return}
    const id='v'+Date.now().toString(36);P.voices.push({id,name});S.sVoice=id;P.narrator='rec:'+id;save();render();return}
  if(a==='delvoice'){const id=S.sVoice;if(S.confirmDel!==id){S.confirmDel=id;render();return}
    Object.keys(CLIPS).filter(k=>k.startsWith(id+'|')||(id==='v1'&&!k.includes('|'))).forEach(delClip);
    P.voices=P.voices.filter(v=>v.id!==id);if(P.narrator==='rec:'+id)P.narrator='rec:'+P.voices[0].id;S.sVoice=P.voices[0].id;S.confirmDel=null;save();render();return}
  if(a==='sayk'){say(b.dataset.k,b.dataset.t);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),400);return}
  if(a==='open'){const i=+b.dataset.i;if(i+1<=P.unlocked)openStage(i);return}
  if(a==='unlock'){P.unlocked=STAGES.length;save();render();return}
  if(a==='reset'){P={unlocked:1,stars:{}};save();render();return}
  if(a==='testvoice'){speak('שָׁלוֹם! אֲנִי אַרְנָבִי. בּוֹא נִקְרָא יַחַד: אַבָּא, סַבָּא, גַּמָּל!',.9);return}
  if(a==='sayintro'){say('intro:'+S.stage,STAGES[S.stage].intro,.9);return}
  if(a==='saysyl'||a==='sayword'){speak(b.dataset.t);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),400);return}
  if(a==='next'){nextStep();return}
  if(a==='nextstage'){openStage(S.stage+1);return}
  if(a==='again'){openStage(S.stage);return}
  const r=S.round;if(!r)return;
  if(a==='replay'){if(r.kind==='build')say(wordKey(r.word),r.word);else say(r.key,r.say);return}
  if(a==='pick'){
    if(S.locked)return;
    if(b.dataset.v===r.answer){
      S.locked=true;b.classList.add('ok');feedback(true);
      if(r.kind==='read')say(wordKey(r.word),r.word);
      setTimeout(advance,1100);
    }else{
      S.mistakes++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');feedback(false);
      if(r.kind==='listen')setTimeout(()=>say(r.key,r.say),500);
    }
    return;
  }
  if(a==='tile'){
    if(S.locked)return;
    const t=r.tiles[+b.dataset.i];if(t.used)return;
    if(t.s===r.syl[r.filled]){
      t.used=true;r.filled++;
      if(r.filled===r.syl.length){S.locked=true;render();feedback(true);say(wordKey(r.word),r.word);setTimeout(advance,1400)}
      else render();
    }else{
      S.mistakes++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');feedback(false);
    }
  }
});
app.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.c;if(!c)return;
  if(c==='voice'){P.voice=e.target.value;pickVoice()}
  if(c==='pitch')P.pitch=parseFloat(e.target.value);
  if(c==='speed')P.speed=e.target.value;
  if(c==='narrator'){const v=e.target.value;if(v.startsWith('tts:')){P.narrator='tts';P.voice=v.slice(4);pickVoice();save();render();speak('שָׁלוֹם! בּוֹא נִקְרָא יַחַד.',.9);return}P.narrator=v;save();render();return}
  save();speak('שָׁלוֹם! בּוֹא נִקְרָא יַחַד.',.9);
});
render();
loadClips();
if(location.protocol==='https:'&&/github\.io$/.test(location.hostname)){try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
